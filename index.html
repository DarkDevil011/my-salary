
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#100d1c" />
  <title>MY SALARY | مدیریت مالی شخصی</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0c0a13; --panel:rgba(30,25,45,.76);
      --panel2:rgba(43,34,63,.62); --line:rgba(255,255,255,.09);
      --purple:#a78bfa; --purple2:#7c3aed;
      --text:#f6f2ff; --muted:#a9a1b8;
      --green:#65d6a0; --red:#ff7d91;
      --radius:20px;
    }
    *{box-sizing:border-box}
    body{margin:0;background:
      radial-gradient(ellipse at 15% 0%,rgba(124,58,237,.20),transparent 40%),
      radial-gradient(ellipse at 90% 80%,rgba(91,55,160,.12),transparent 38%),
      var(--bg);color:var(--text);font-family:"Vazirmatn",sans-serif;min-height:100vh}
    button,input{font:inherit}
    button{cursor:pointer}
    .hidden{display:none!important}
    .muted{color:var(--muted)}
    .small{font-size:12px}
    .glass{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:var(--radius);box-shadow:0 12px 45px #0002}
    .auth-wrap{min-height:100vh;display:grid;place-items:center;padding:22px}
    .auth-card{width:min(440px,100%);padding:30px}
    .brand{text-align:center;margin-bottom:25px}
    .brand-mark{width:62px;height:62px;margin:auto auto 13px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,#a78bfa,#6d28d9);font-size:27px;font-weight:800;box-shadow:0 10px 35px #7c3aed55}
    .brand h1{font-size:25px;letter-spacing:2px;margin:0}
    .brand p{font-size:13px;color:var(--muted);margin:7px 0}
    .field{margin:14px 0}
    .field label{display:block;font-size:13px;color:#d8d0e8;margin-bottom:7px}
    .field input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:#ffffff08;color:white;outline:none}
    .field input:focus{border-color:var(--purple)}
    .btn{border:0;border-radius:13px;padding:12px 17px;color:white;background:linear-gradient(135deg,#8b5cf6,#6d28d9);font-weight:700}
    .btn:disabled{opacity:.55;cursor:wait}
    .btn-outline{background:#ffffff09;border:1px solid var(--line);color:var(--text)}
    .full{width:100%}
    .auth-actions{display:flex;gap:10px;margin-top:18px}
    .auth-actions button{flex:1}
    .message{font-size:13px;line-height:1.9;margin-top:14px;color:var(--muted);min-height:22px}
    .message.error{color:var(--red)} .message.success{color:var(--green)}
    .app{display:flex;min-height:100vh}
    .sidebar{width:265px;flex-shrink:0;padding:22px 15px;position:fixed;right:0;top:0;bottom:0;overflow:auto;border-left:1px solid var(--line);background:rgba(16,13,27,.88);backdrop-filter:blur(20px);z-index:5}
    .side-brand{display:flex;align-items:center;gap:12px;padding:5px 8px 22px}
    .side-brand .brand-mark{width:43px;height:43px;border-radius:14px;font-size:19px;margin:0}
    .side-brand strong{letter-spacing:1.5px}
    .side-brand small{display:block;color:var(--muted);font-size:11px}
    .nav-label{font-size:11px;color:#837a98;padding:15px 12px 7px}
    .nav-btn{width:100%;display:flex;align-items:center;gap:11px;text-align:right;padding:11px 13px;border:1px solid transparent;border-radius:12px;background:transparent;color:#c9c1d8;font-size:13px;margin:3px 0}
    .nav-btn:hover,.nav-btn.active{background:linear-gradient(90deg,#8b5cf625,#8b5cf610);border-color:#a78bfa35;color:white}
    .nav-icon{width:23px;text-align:center;font-size:17px}
    .main{margin-right:265px;width:calc(100% - 265px);padding:25px 30px 50px;max-width:1600px}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:26px}
    .topbar h2{margin:0;font-size:22px}
    .topbar p{margin:5px 0 0;color:var(--muted);font-size:12px}
    .user-chip{display:flex;align-items:center;gap:10px;padding:9px 13px;border:1px solid var(--line);border-radius:14px;background:#ffffff08;font-size:12px;max-width:55%}
    .avatar{width:34px;height:34px;border-radius:12px;background:#8b5cf633;color:#c4b5fd;display:grid;place-items:center;font-weight:800}
    .mobile-menu{display:none}
    .welcome{padding:24px 25px;margin-bottom:20px;background:linear-gradient(115deg,#6d28d944,#29203d99);position:relative;overflow:hidden}
    .welcome:after{content:"✦";position:absolute;left:35px;top:12px;font-size:95px;color:#ffffff0c}
    .welcome h3{margin:0 0 8px;font-size:19px}
    .welcome p{margin:0;color:#c5bad8;font-size:13px}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
    .stat{padding:19px}
    .stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}
    .stat-icon{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:#a78bfa20;font-size:17px}
    .stat-value{font-size:23px;font-weight:800;margin-top:13px;direction:ltr;text-align:right}
    .stat-foot{font-size:11px;color:var(--muted);margin-top:5px}
    .content-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:15px}
    .section-card{padding:20px;min-height:180px}
    .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}
    .section-head h3{font-size:14px;margin:0}
    .section-head span{font-size:11px;color:var(--muted)}
    .quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .quick{border:1px solid var(--line);background:#ffffff06;color:#eee8f8;border-radius:13px;padding:15px 8px;text-align:center;font-size:12px}
    .quick b{display:block;font-size:20px;margin-bottom:5px}
    .quick:hover{border-color:#a78bfa88;background:#8b5cf61a}
    .activity{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px}
    .activity:last-child{border:0}
    .activity-dot{width:9px;height:9px;border-radius:50%;background:var(--purple);box-shadow:0 0 12px #a78bfa}
    .page-panel{padding:24px;min-height:300px}
    .page-panel h3{margin-top:0}
    .page-panel p{color:var(--muted);font-size:13px;line-height:2}
    .notice{border:1px solid #a78bfa30;background:#a78bfa0d;padding:13px 15px;border-radius:13px;color:#d9cdf5;font-size:12px;line-height:2}
    .logout{width:100%;margin-top:20px}
    .footer{text-align:center;color:#756d83;font-size:11px;margin-top:30px}
    @media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:760px){
      .sidebar{transform:translateX(105%);transition:.25s;width:270px;box-shadow:-20px 0 60px #0007}
      .sidebar.open{transform:translateX(0)}
      .main{margin:0;width:100%;padding:18px 14px 35px}
      .mobile-menu{display:inline-grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:#ffffff0a;color:white}
      .topbar{align-items:center}
      .topbar h2{font-size:18px}
      .content-grid{grid-template-columns:1fr}
      .grid{gap:10px}
      .stat{padding:15px}
      .stat-value{font-size:19px}
      .quick-grid{grid-template-columns:repeat(2,1fr)}
      .user-chip{max-width:48%;overflow:hidden}
    }
    @media(max-width:380px){.grid{grid-template-columns:1fr 1fr}.stat-value{font-size:17px}}

    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
    .panel{padding:20px;margin-bottom:16px}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .control{display:flex;flex-direction:column;gap:6px}
    .control.fullrow{grid-column:1/-1}
    .control label{font-size:12px;color:#d8d0e8}
    .control input,.control select,.control textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#ffffff0b;color:#fff;outline:none;min-width:0}
    .control select option{background:#211a31;color:white}
    .control textarea{min-height:76px;resize:vertical}
    .form-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:14px}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
    table{width:100%;border-collapse:collapse;min-width:650px;font-size:12px}
    th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
    th{color:#c7b9e7;background:#ffffff08;font-weight:600}
    tr:last-child td{border-bottom:0}
    .pill{display:inline-block;padding:4px 9px;border-radius:30px;background:#a78bfa20;color:#d8caff;font-size:11px}
    .empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}
    .alert{padding:12px 14px;border-radius:12px;font-size:12px;line-height:1.9;margin:10px 0}
    .alert.ok{background:#65d6a014;border:1px solid #65d6a033;color:#9de9c2}
    .alert.bad{background:#ff7d9114;border:1px solid #ff7d9133;color:#ffabb8}
    .alert.info{background:#a78bfa12;border:1px solid #a78bfa30;color:#d8caff}
    .metric-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .metric{padding:15px;border:1px solid var(--line);border-radius:14px;background:#ffffff06}
    .metric small{color:var(--muted);display:block}
    .metric b{display:block;margin-top:8px;font-size:18px}
    .danger{color:#ffabb8}
    .btn-sm{padding:8px 12px;font-size:12px}
    .inline-note{color:var(--muted);font-size:11px;line-height:1.8}
    .loading{padding:20px;color:var(--muted);text-align:center}
    @media(max-width:650px){.form-grid,.metric-row{grid-template-columns:1fr}.panel{padding:15px}}

  </style>
</head>
<body>

  <section id="authScreen" class="auth-wrap">
    <div class="auth-card glass">
      <div class="brand">
        <div class="brand-mark">M</div>
        <h1>MY SALARY</h1>
        <p>مدیریت هوشمند حقوق و امور مالی شخصی</p>
      </div>

    <main class="main">

          <div><h2 id="pageTitle">داشبورد تحلیل</h2><p id="todayText">فضای مالی شخصی شما</p></div>

      </header>

      <div id="pageContent"></div>
    </main>
  </section>

  <script type="module">

    const SUPABASE_URL = "https://wsvbqopqltweegalzzyz.supabase.co";

    const configs={

    function showApp(user){currentUser=user;authScreen.classList.add("hidden");appScreen.classList.remove("hidden");$("userEmail").textContent=user.email||"کاربر";$("connectionStatus").textContent="متصل به Supabase";$("todayText").textContent=new Intl.DateTimeFormat("fa-IR",{dateStyle:"full",timeZone:"Asia/Tehran"}).format(new Date());openPage("dashboard")}
    function showAuth(){currentUser=null;appScreen.classList.add("hidden");authScreen.classList.remove("hidden")}
    async function authAction(action){const email=$("email").value.trim(),password=$("password").value;if(!email)return setAuthMessage("ایمیل را وارد کن.","error");let r;if(action==="login"){if(!password)return setAuthMessage("رمز عبور را وارد کن.","error");r=await supabase.auth.signInWithPassword({email,password})}else if(action==="signup"){if(password.length<6)return setAuthMessage("رمز عبور باید حداقل ۶ کاراکتر باشد.","error");r=await supabase.auth.signUp({email,password})}else{r=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.href})}setAuthMessage(r.error?r.error.message:(action==="reset"?"لینک بازیابی ارسال شد.":r.data.session?"با موفقیت وارد شدی.":"حساب ساخته شد؛ در صورت فعال بودن تأیید ایمیل، صندوق ورودی را بررسی کن."),r.error?"error":"success")}

    async function fetchRows(table,order="created_at",limit=100){const {data,error}=await supabase.from(table).select("*").eq("user_id",currentUser.id).order(order,{ascending:false}).limit(limit);if(error)throw error;return data||[]}
    async function getView(view){const {data,error}=await supabase.from(view).select("*").eq("user_id",currentUser.id).limit(100);if(error)throw error;return data||[]}
    function formHtml(cfg){return `<form id="recordForm" class="panel glass"><div class="section-head"><h3>${cfg.title}</h3><span>ثبت اطلاعات</span></div><div class="form-grid">${cfg.fields.map(f=>{let val=f.default??"",required=f.required?"required":"";if(f.type==="select")return `<div class="control"><label>${f.label}</label><select name="${f.name}" ${required}>${f.options.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join("")}</select></div>`;if(f.type==="checkbox")return `<div class="control"><label>${f.label}</label><select name="${f.name}"><option value="false">خیر</option><option value="true" ${val?"selected":""}>بله</option></select></div>`;return `<div class="control"><label>${f.label}</label><input name="${f.name}" type="${f.type||"text"}" value="${esc(val)}" ${required} ${f.placeholder?`placeholder="${esc(f.placeholder)}"`:""} ${f.type==="number"?'min="0" step="any"':""}></div>`}).join("")}</div><div class="form-actions"><button class="btn" type="submit">ثبت اطلاعات</button><span class="inline-note">ثبت به حساب واردشده متصل است.</span></div><div id="formFeedback"></div></form>`}
    function tableHtml(rows,cols){if(!rows.length)return `<div class="empty">هنوز رکوردی برای نمایش وجود ندارد.</div>`;return `<div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(c[2]?c[2](r[c[0]],r):r[c[0]]??"—")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
    async function openCrud(page){const cfg=configs[page];shell(`<section class="page-panel glass"><h3>${cfg.title}</h3><p>${cfg.desc}</p></section><div id="pageNotice"></div>${formHtml(cfg)}<section class="panel glass"><div class="toolbar"><h3>سوابق ثبت‌شده</h3><button id="refreshBtn" class="btn btn-outline btn-sm">بروزرسانی</button></div><div id="records" class="loading">در حال دریافت اطلاعات…</div></section>`);$("refreshBtn").onclick=()=>loadCrudRows(page);$("recordForm").onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),row={user_id:currentUser.id};cfg.fields.forEach(f=>{let v=fd.get(f.name);if(v===null)return;if(f.type==="number")row[f.name]=v===""?0:Number(v);else if(f.type==="checkbox")row[f.name]=v==="true";else if(f.type==="datetime-local")row[f.name]=new Date(v).toISOString();else if(f.name==="start_time"||f.name==="end_time"){}else row[f.name]=v===""?null:v});if(page==="work"){const d=fd.get("work_date"),st=fd.get("start_time"),en=fd.get("end_time");if(!st){$("formFeedback").innerHTML=msg("ساعت ورود الزامی است.","bad");return}row.started_at=localIso(d,st);row.ended_at=en?localIso(d,en):null;delete row.start_time;delete row.end_time;delete row.work_date;row.work_date=d}const {error}=await supabase.from(cfg.table).insert(row);if(error){$("formFeedback").innerHTML=msg(error.message,"bad");return}e.currentTarget.reset();$("formFeedback").innerHTML=msg("اطلاعات با موفقیت ثبت شد.","ok");await loadCrudRows(page);if(page==="sales"||page==="work")loadDashboard()};await loadCrudRows(page)}
    async function loadCrudRows(page){const cfg=configs[page],el=$("records");if(!el)return;el.innerHTML="در حال دریافت…";try{let rows;if(page==="goals"){rows=await getView("v_performance_goal_progress");cache.goals=rows;el.innerHTML=tableHtml(rows,cfg.columns);return}else rows=await fetchRows(cfg.table,cfg.order);cache[page]=rows;el.innerHTML=tableHtml(rows,cfg.columns)}catch(e){el.innerHTML=msg("خطا در دریافت اطلاعات: "+e.message,"bad")}}
    async function dashboard(){shell(`<section class="welcome glass"><h3>خوش اومدی 👋</h3><p>آمار زیر مستقیماً از داده‌های حساب تو در Supabase خوانده می‌شود.</p></section><section class="grid"><div class="stat glass"><div class="stat-top"><span>حقوق محاسبه‌شده</span><span class="stat-icon">💜</span></div><div class="stat-value" id="salaryValue">—</div><div class="stat-foot">مجموع دوره‌های حقوقی</div></div><div class="stat glass"><div class="stat-top"><span>پول در دسترس</span><span class="stat-icon">💳</span></div><div class="stat-value" id="moneyValue">—</div><div class="stat-foot">موجودی حساب‌ها</div></div><div class="stat glass"><div class="stat-top"><span>دارایی خالص</span><span class="stat-icon">◈</span></div><div class="stat-value" id="assetsValue">—</div><div class="stat-foot">پس از بدهی‌ها</div></div><div class="stat glass"><div class="stat-top"><span>کارکرد این ماه</span><span class="stat-icon">◷</span></div><div class="stat-value" id="hoursValue">—</div><div class="stat-foot">بر اساس جمع دقیقه‌های ثبت‌شده</div></div></section><section class="content-grid"><div class="section-card glass"><div class="section-head"><h3>دسترسی سریع</h3><span>میانبر بخش‌ها</span></div><div class="quick-grid"><button class="quick" data-page="work"><b>◷</b>ثبت ساعت کاری</button><button class="quick" data-page="sales"><b>↗</b>ثبت فروش</button><button class="quick" data-page="payroll"><b>▤</b>حقوق</button><button class="quick" data-page="transactions"><b>💳</b>تراکنش مالی</button><button class="quick" data-page="claims"><b>◈</b>مطالبات فروشگاه</button><button class="quick" data-page="calendar"><b>▦</b>یادآورها</button></div></div><div class="section-card glass"><div class="section-head"><h3>وضعیت اتصال</h3><span>داده زنده</span></div><div id="dashboardStatus" class="inline-note">در حال دریافت اطلاعات…</div></div></section><div id="pageNotice"></div>`);await loadDashboard()}
    async function loadDashboard(){if(!currentUser)return;const monthStart=today().slice(0,7)+"-01";const [f,p,w]=await Promise.allSettled([supabase.from("v_finance_dashboard").select("*").maybeSingle(),getView("v_payroll_dashboard_summary"),supabase.from("v_daily_work_summary").select("actual_work_minutes").eq("user_id",currentUser.id).gte("day",monthStart)]);if(f.status==="fulfilled"&&!f.value.error&&f.value.data){$("moneyValue").textContent=money(f.value.data.available_money);$("assetsValue").textContent=money(f.value.data.net_worth)}else $("moneyValue").textContent="—";if(p.status==="fulfilled"&&p.value[0])$("salaryValue").textContent=money(p.value[0].total_payroll);if(w.status==="fulfilled"&&!w.value.error){const mins=(w.value.data||[]).reduce((s,r)=>s+num(r.actual_work_minutes),0);$("hoursValue").textContent=nfmt(Math.floor(mins/60))+" ساعت و "+nfmt(mins%60)+" دقیقه"}const errors=[f,p].filter(x=>x.status==="rejected").length+(w.status==="fulfilled"&&w.value.error?1:0);$("dashboardStatus").innerHTML=errors?msg("بخشی از ویوها در دسترس نیستند؛ جزئیات خطا را در Console مرورگر ببین.","bad"):"اطلاعات داشبورد با موفقیت از دیتابیس دریافت شد."}
    async function payrollPage(){shell(`<section class="page-panel glass"><h3>حقوق و دریافتی</h3><p>محاسبه حقوق با تابع دیتابیس انجام می‌شود تا قوانین ثبت‌شده و snapshot دوره حفظ شود.</p><div class="alert info">قبل از محاسبه، فروش‌ها و بازه‌های کاری همان دوره را ثبت کن. تاریخ شروع و پایان را به فرمت میلادی وارد کن؛ نمایش تاریخ‌ها در فهرست فارسی است.</div></section><div id="pageNotice"></div><form id="payrollCalc" class="panel glass"><div class="form-grid"><div class="control"><label>سال میلادی</label><input name="year" type="number" min="2000" max="2200" required value="${new Date().getFullYear()}"></div><div class="control"><label>ماه عددی (۱ تا ۱۲)</label><input name="month" type="number" min="1" max="12" required value="${new Date().getMonth()+1}"></div><div class="control"><label>شروع دوره</label><input name="period_start" type="date" required></div><div class="control"><label>پایان دوره</label><input name="period_end" type="date" required></div></div><div class="form-actions"><button class="btn">محاسبه دوره حقوق</button></div><div id="payrollFeedback"></div></form><section class="panel glass"><div class="toolbar"><h3>دوره‌های حقوقی</h3><button id="refreshPayroll" class="btn btn-outline btn-sm">بروزرسانی</button></div><div id="payrollRows" class="loading">در حال دریافت…</div></section>`);$("payrollCalc").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));const {data,error}=await supabase.rpc("calculate_payroll_period",{p_year:Number(d.year),p_month:Number(d.month),p_period_start:d.period_start,p_period_end:d.period_end});$("payrollFeedback").innerHTML=error?msg(error.message,"bad"):msg("دوره حقوق محاسبه شد. شناسه: "+data,"ok");if(!error)loadPayrollRows()};$("refreshPayroll").onclick=loadPayrollRows;await loadPayrollRows()}
    async function loadPayrollRows(){const el=$("payrollRows");if(!el)return;const {data,error}=await supabase.from("payroll_periods").select("*").eq("user_id",currentUser.id).order("year",{ascending:false}).order("month",{ascending:false});if(error){el.innerHTML=msg(error.message,"bad");return}el.innerHTML=tableHtml(data||[],[["year","سال"],["month","ماه"],["status","وضعیت"],["sales_total","فروش",money],["commission_total","پورسانت",money],["calculated_total","حقوق محاسبه‌شده",money],["paid_amount","پرداخت‌شده",money],["outstanding_amount","مانده",money]])}

    async function reconciliation(){const views=["v_reconciliation_payroll","v_reconciliation_payroll_links","v_reconciliation_installments","v_reconciliation_receivables","v_reconciliation_store_claims"];shell(`<section class="page-panel glass"><h3>مرکز مغایرت‌یابی</h3><p>فهرست موارد از ویوهای مغایرت دیتابیس خوانده می‌شود. این صفحه فقط گزارش می‌دهد و رکورد مالی را خودکار تغییر نمی‌دهد.</p></section><div id="reconSummary" class="panel glass loading">در حال دریافت…</div><div id="reconItems"></div>`);const {data,error}=await supabase.from("v_reconciliation_dashboard").select("*").eq("user_id",currentUser.id).maybeSingle();$("reconSummary").innerHTML=error?msg(error.message,"bad"):`<div class="metric-row"><div class="metric"><small>کل موارد</small><b>${nfmt(data?.total_issues)}</b></div><div class="metric"><small>بحرانی</small><b>${nfmt(data?.critical_issues)}</b></div><div class="metric"><small>زیاد</small><b>${nfmt(data?.high_issues)}</b></div></div>`;let html="";for(const v of views){const {data,error}=await supabase.from(v).select("*").eq("user_id",currentUser.id).limit(100);html+=`<section class="panel glass"><h3>${v}</h3>${error?msg(error.message,"bad"):tableHtml(data||[],[["issue_code","کد"],["severity","شدت"],["entity_type","نوع"],["expected_value","مقدار مورد انتظار",money],["actual_value","مقدار واقعی",money],["detected_at","زمان",fmtDateTime]])}</section>`}$("reconItems").innerHTML=html}
    async function simpleViewPage(title,view,cols,desc=""){shell(`<section class="page-panel glass"><h3>${title}</h3><p>${desc}</p></section><section class="panel glass"><div id="viewRows" class="loading">در حال دریافت…</div></section>`);let q=supabase.from(view).select("*").limit(100);if(view!=="v_finance_dashboard")q=q.eq("user_id",currentUser.id);const {data,error}=await q;$("viewRows").innerHTML=error?msg(error.message,"bad"):tableHtml(data||[],cols)}
    async function settingsPage(){shell(`<section class="page-panel glass"><h3>تنظیمات مدیریتی</h3><p>قوانین حقوق و پورسانت از جدول نسخه‌دار compensation_rules خوانده می‌شوند. ساخت قانون جدید با تابع امن دیتابیس انجام می‌شود.</p></section><div id="pageNotice"></div><form id="ruleForm" class="panel glass"><h3>ثبت قانون جدید حقوق</h3><div class="form-grid"><div class="control"><label>نام قانون</label><input name="rule_name" required value="قانون حقوق اصلی"></div><div class="control"><label>حقوق ثابت (تومان)</label><input name="fixed_salary" type="number" value="6000000" required></div><div class="control"><label>نرخ ساعتی (تومان)</label><input name="hourly_rate" type="number" value="30000" required></div><div class="control"><label>مدل پورسانت</label><select name="commission_mode"><option value="flat_rate">نرخ روی کل فروش (flat)</option><option value="progressive">پلکانی واقعی</option></select></div><div class="control"><label>مبنای فروش</label><select name="commission_basis"><option value="combined">مجموع</option><option value="website">سایت</option><option value="in_person">حضوری</option></select></div><div class="control"><label>تاریخ شروع اعتبار</label><input name="valid_from" type="date" required value="${today()}"></div><div class="control fullrow"><label>پله‌های پورسانت به صورت JSON (lower_amount, upper_amount, rate_percent, tier_order)</label><textarea name="tiers" required>[{"lower_amount":0,"upper_amount":299000000,"rate_percent":2,"tier_order":1},{"lower_amount":299000000,"upper_amount":null,"rate_percent":3,"tier_order":2}]</textarea></div><div class="control fullrow"><label>یادداشت</label><input name="notes"></div></div><div class="form-actions"><button class="btn">ثبت نسخه جدید قانون</button></div><div id="ruleFeedback"></div></form><section class="panel glass"><h3>قوانین ثبت‌شده</h3><div id="rulesRows" class="loading"></div></section>`);$("ruleForm").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));let tiers;try{tiers=JSON.parse(d.tiers);if(!Array.isArray(tiers))throw Error("tiers باید آرایه باشد")}catch(err){$("ruleFeedback").innerHTML=msg("JSON پله‌ها معتبر نیست: "+err.message,"bad");return}const args={p_rule_name:d.rule_name,p_fixed_salary:Number(d.fixed_salary),p_hourly_rate:Number(d.hourly_rate),p_commission_mode:d.commission_mode,p_commission_basis:d.commission_basis,p_valid_from:d.valid_from,p_tiers:tiers,p_notes:d.notes||null};const {data,error}=await supabase.rpc("create_compensation_rule",args);$("ruleFeedback").innerHTML=error?msg(error.message,"bad"):msg("قانون جدید ثبت شد. شناسه: "+data,"ok");if(!error)loadRules()};await loadRules()}
    async function loadRules(){const el=$("rulesRows");if(!el)return;const {data,error}=await supabase.from("compensation_rules").select("*").eq("user_id",currentUser.id).order("valid_from",{ascending:false});el.innerHTML=error?msg(error.message,"bad"):tableHtml(data||[],[["rule_name","نام قانون"],["fixed_salary","حقوق ثابت",money],["hourly_rate","نرخ ساعتی",money],["commission_mode","مدل"],["commission_basis","مبنا"],["valid_from","شروع اعتبار",fmtDate],["is_active","فعال",v=>v?"بله":"خیر"]])}
    async function archivePage(){shell(`<section class="page-panel glass"><h3>بایگانی و پشتیبان‌گیری</h3><p>ساخت snapshot از طریق تابع create_personal_data_archive انجام می‌شود.</p></section><div id="pageNotice"></div><form id="archiveForm" class="panel glass"><div class="control"><label>نام آرشیو</label><input name="archive_name" required value="پشتیبان ${today()}"></div><div class="form-actions"><button class="btn">ساخت نسخه پشتیبان</button></div><div id="archiveFeedback"></div></form><section class="panel glass"><h3>آرشیوهای قبلی</h3><div id="archiveRows" class="loading"></div></section>`);$("archiveForm").onsubmit=async e=>{e.preventDefault();const name=new FormData(e.currentTarget).get("archive_name");const {data,error}=await supabase.rpc("create_personal_data_archive",{p_archive_name:name});$("archiveFeedback").innerHTML=error?msg(error.message,"bad"):msg("نسخه پشتیبان ایجاد شد. شناسه: "+data,"ok");if(!error)loadArchives()};await loadArchives()}
    async function loadArchives(){const el=$("archiveRows");if(!el)return;const {data,error}=await supabase.from("data_archive_snapshots").select("id,archive_name,archive_format,record_count,created_at,checksum").eq("user_id",currentUser.id).order("created_at",{ascending:false});el.innerHTML=error?msg(error.message,"bad"):tableHtml(data||[],[["archive_name","نام"],["archive_format","قالب"],["record_count","تعداد رکورد",nfmt],["created_at","تاریخ",fmtDateTime],["checksum","Checksum"]])}
    async function openPage(page){if(!titles[page])return;activePage=page;navActive(page);$("pageTitle").textContent=titles[page];$("sidebar").classList.remove("open");try{if(page==="dashboard")return await dashboard();if(configs[page])return await openCrud(page);if(page==="transactions")return await openCrud("transactions");if(page==="payroll")return await payrollPage();if(page==="reports")return await reportsPage();if(page==="reconciliation")return await reconciliation();if(page==="history")return await simpleViewPage(titles[page],"v_audit_history",[["created_at","زمان",fmtDateTime],["action","عملیات"],["entity_type","نوع رکورد"],["entity_id","شناسه"],["details","جزئیات",v=>JSON.stringify(v)]],"رویدادهای قابل مشاهده در audit_logs.");if(page==="trace")return await simpleViewPage(titles[page],"v_financial_source_trace",[["transaction_date","تاریخ",fmtDateTime],["title","عنوان"],["amount","مبلغ",money],["source_type","منشأ"],["account_name","حساب"],["payroll_year","سال حقوق"],["payroll_month","ماه حقوق"]],"منشأ تراکنش‌ها و ارتباط آن‌ها با پرداخت‌های دیگر.");if(page==="archive")return await archivePage();if(page==="settings")return await settingsPage();if(page==="finance")return await simpleViewPage("نمای کلی امور مالی","v_finance_dashboard",[["available_money","پول در دسترس",money],["receivables","مطالبات",money],["debts","بدهی‌ها",money],["total_financial_assets","کل دارایی",money],["net_worth","دارایی خالص",money]]);if(page==="installments")return await simpleViewPage(titles[page],"v_finance_installment_balances",[["title","عنوان"],["creditor_name","طلبکار"],["total_amount","کل",money],["paid_amount","پرداخت‌شده",money],["remaining_amount","مانده",money],["next_due_date","سررسید",fmtDate],["status","وضعیت"]]);if(page==="receivables")return await openCrud("receivables");if(page==="accounts")return await openCrud("accounts");if(page==="goals")return await openCrud("goals");if(page==="calendar")return await openCrud("calendar");if(page==="leave")return await openCrud("leave");if(page==="work")return await openCrud("work");if(page==="sales")return await openCrud("sales");if(page==="claims")return await openCrud("claims");shell(`<section class="page-panel glass"><h3>${titles[page]}</h3><p>این بخش در این نسخه فقط خواندنی یا در انتظار تکمیل عملیات تخصصی است.</p></section>`)}catch(e){shell(`<section class="page-panel glass"><h3>${titles[page]}</h3>${msg(e.message,"bad")}</section>`)}}
    async function init(){const {data,error}=await supabase.auth.getSession();if(error)setAuthMessage(error.message,"error");if(data.session?.user)showApp(data.session.user);else showAuth();supabase.auth.onAuthStateChange((_event,session)=>{if(session?.user&&currentUser?.id!==session.user.id)showApp(session.user);else if(!session)showAuth()})}
    init();
  </script>
