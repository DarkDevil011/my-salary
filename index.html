
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#100d1c" />
  <title>مدیریت حقوق و امور مالی شخصی</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%237c3aed'/%3E%3Cpath d='M18 45V19h7l7 12 7-12h7v26h-7V31l-7 11-7-11v14z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0c0a13; --panel:rgba(30,25,45,.76);
      --panel2:rgba(43,34,63,.62); --line:rgba(255,255,255,.09);
      --purple:#a78bfa; --purple2:#7c3aed;
      --text:#f6f2ff; --muted:#a9a1b8;
      --green:#65d6a0; --red:#ff7d91;
      --radius:20px;
    }
    *{box-sizing:border-box}
    body{margin:0;background:
      radial-gradient(ellipse at 15% 0%,rgba(124,58,237,.20),transparent 40%),
      radial-gradient(ellipse at 90% 80%,rgba(91,55,160,.12),transparent 38%),
      var(--bg);color:var(--text);font-family:"Vazirmatn",sans-serif;min-height:100vh}
    button,input{font:inherit}
    button{cursor:pointer}
    .hidden{display:none!important}
    .muted{color:var(--muted)}
    .small{font-size:12px}
    .glass{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:var(--radius);box-shadow:0 12px 45px #0002}
    .auth-wrap{min-height:100vh;display:grid;place-items:center;padding:22px}
    .auth-card{width:min(440px,100%);padding:30px}
    .brand{text-align:center;margin-bottom:25px}
    .brand-mark{width:62px;height:62px;margin:auto auto 13px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,#a78bfa,#6d28d9);font-size:0;font-weight:800;box-shadow:0 10px 35px #7c3aed55}
    .brand h1{font-size:25px;letter-spacing:2px;margin:0}
    .brand p{font-size:13px;color:var(--muted);margin:7px 0}
    .field{margin:14px 0}
    .field label{display:block;font-size:13px;color:#d8d0e8;margin-bottom:7px}
    .field input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:#ffffff08;color:white;outline:none}
    .field input:focus{border-color:var(--purple)}
    .btn{border:0;border-radius:13px;padding:12px 17px;color:white;background:linear-gradient(135deg,#8b5cf6,#6d28d9);font-weight:700}
    .btn:disabled{opacity:.55;cursor:wait}
    .btn-outline{background:#ffffff09;border:1px solid var(--line);color:var(--text)}
    .full{width:100%}
    .auth-actions{display:flex;gap:10px;margin-top:18px}
    .auth-actions button{flex:1}
    .message{font-size:13px;line-height:1.9;margin-top:14px;color:var(--muted);min-height:22px}
    .message.error{color:var(--red)} .message.success{color:var(--green)}
    .app{display:flex;min-height:100vh}
    .sidebar{width:265px;flex-shrink:0;padding:22px 15px;position:fixed;right:0;top:0;bottom:0;overflow:auto;border-left:1px solid var(--line);background:rgba(16,13,27,.88);backdrop-filter:blur(20px);z-index:5}
    .side-brand{display:flex;align-items:center;gap:12px;padding:5px 8px 22px}
    .side-brand .brand-mark{width:43px;height:43px;border-radius:14px;font-size:0;margin:0}
    .side-brand strong{letter-spacing:1.5px}
    .side-brand small{display:block;color:var(--muted);font-size:11px}
    .nav-label{font-size:11px;color:#837a98;padding:15px 12px 7px}
    .nav-btn{width:100%;display:flex;align-items:center;gap:11px;text-align:right;padding:11px 13px;border:1px solid transparent;border-radius:12px;background:transparent;color:#c9c1d8;font-size:13px;margin:3px 0}
    .nav-btn:hover,.nav-btn.active{background:linear-gradient(90deg,#8b5cf625,#8b5cf610);border-color:#a78bfa35;color:white}
    .nav-icon{width:23px;text-align:center;font-size:17px}
    .main{margin-right:265px;width:calc(100% - 265px);padding:25px 30px 50px;max-width:1600px}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:26px}
    .topbar h2{margin:0;font-size:22px}
    .topbar p{margin:5px 0 0;color:var(--muted);font-size:12px}
    .user-chip{display:flex;align-items:center;gap:10px;padding:9px 13px;border:1px solid var(--line);border-radius:14px;background:#ffffff08;font-size:12px;max-width:55%}
    .avatar{width:34px;height:34px;border-radius:12px;background:#8b5cf633;color:#c4b5fd;display:grid;place-items:center;font-weight:800}
    .mobile-menu{display:none}
    .welcome{padding:24px 25px;margin-bottom:20px;background:linear-gradient(115deg,#6d28d944,#29203d99);position:relative;overflow:hidden}
    .welcome:after{content:"✦";position:absolute;left:35px;top:12px;font-size:95px;color:#ffffff0c}
    .welcome h3{margin:0 0 8px;font-size:19px}
    .welcome p{margin:0;color:#c5bad8;font-size:13px}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
    .stat{padding:19px}
    .stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}
    .stat-icon{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:#a78bfa20;font-size:17px}
    .stat-value{font-size:23px;font-weight:800;margin-top:13px;direction:ltr;text-align:right}
    .stat-foot{font-size:11px;color:var(--muted);margin-top:5px}
    .content-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:15px}
    .section-card{padding:20px;min-height:180px}
    .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}
    .section-head h3{font-size:14px;margin:0}
    .section-head span{font-size:11px;color:var(--muted)}
    .quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .quick{border:1px solid var(--line);background:#ffffff06;color:#eee8f8;border-radius:13px;padding:15px 8px;text-align:center;font-size:12px}
    .quick b{display:block;font-size:20px;margin-bottom:5px}
    .quick:hover{border-color:#a78bfa88;background:#8b5cf61a}
    .activity{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px}
    .activity:last-child{border:0}
    .activity-dot{width:9px;height:9px;border-radius:50%;background:var(--purple);box-shadow:0 0 12px #a78bfa}
    .page-panel{padding:24px;min-height:300px}
    .page-panel h3{margin-top:0}
    .page-panel p{color:var(--muted);font-size:13px;line-height:2}
    .notice{border:1px solid #a78bfa30;background:#a78bfa0d;padding:13px 15px;border-radius:13px;color:#d9cdf5;font-size:12px;line-height:2}
    .logout{width:100%;margin-top:20px}
    .footer{text-align:center;color:#756d83;font-size:11px;margin-top:30px}
    @media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:760px){
      .sidebar{transform:translateX(105%);transition:.25s;width:270px;box-shadow:-20px 0 60px #0007}
      .sidebar.open{transform:translateX(0)}
      .main{margin:0;width:100%;padding:18px 14px 35px}
      .mobile-menu{display:inline-grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:#ffffff0a;color:white}
      .topbar{align-items:center}
      .topbar h2{font-size:18px}
      .content-grid{grid-template-columns:1fr}
      .grid{gap:10px}
      .stat{padding:15px}
      .stat-value{font-size:19px}
      .quick-grid{grid-template-columns:repeat(2,1fr)}
      .user-chip{max-width:48%;overflow:hidden}
    }
    @media(max-width:380px){.grid{grid-template-columns:1fr 1fr}.stat-value{font-size:17px}}

    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
    .panel{padding:20px;margin-bottom:16px}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .control{display:flex;flex-direction:column;gap:6px}
    .control.fullrow{grid-column:1/-1}
    .control label{font-size:12px;color:#d8d0e8}
    .control input,.control select,.control textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#ffffff0b;color:#fff;outline:none;min-width:0}
    .control select option{background:#211a31;color:white}
    .control textarea{min-height:76px;resize:vertical}
    .form-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:14px}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
    table{width:100%;border-collapse:collapse;min-width:650px;font-size:12px}
    th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
    th{color:#c7b9e7;background:#ffffff08;font-weight:600}
    tr:last-child td{border-bottom:0}
    .pill{display:inline-block;padding:4px 9px;border-radius:30px;background:#a78bfa20;color:#d8caff;font-size:11px}
    .empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}
    .alert{padding:12px 14px;border-radius:12px;font-size:12px;line-height:1.9;margin:10px 0}
    .alert.ok{background:#65d6a014;border:1px solid #65d6a033;color:#9de9c2}
    .alert.bad{background:#ff7d9114;border:1px solid #ff7d9133;color:#ffabb8}
    .alert.info{background:#a78bfa12;border:1px solid #a78bfa30;color:#d8caff}
    .metric-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .metric{padding:15px;border:1px solid var(--line);border-radius:14px;background:#ffffff06}
    .metric small{color:var(--muted);display:block}
    .metric b{display:block;margin-top:8px;font-size:18px}
    .danger{color:#ffabb8}
    .btn-sm{padding:8px 12px;font-size:12px}
    .inline-note{color:var(--muted);font-size:11px;line-height:1.8}
    .loading{padding:20px;color:var(--muted);text-align:center}
    @media(max-width:650px){.form-grid,.metric-row{grid-template-columns:1fr}.panel{padding:15px}}


    :root{
      --bg:#080d1d;--panel:rgba(17,27,51,.76);--panel2:rgba(31,43,74,.62);
      --line:rgba(170,185,255,.13);--purple:#9b9cff;--purple2:#6d6df5;
      --text:#f4f5ff;--muted:#aab3cc;--green:#55d6a0;--red:#ff8296;
      --radius:20px;
    }
    body{background:
      radial-gradient(ellipse at 12% 0%,rgba(82,92,230,.25),transparent 42%),
      radial-gradient(ellipse at 90% 85%,rgba(126,72,220,.18),transparent 40%),
      #080d1d;}
    .glass{background:rgba(19,29,55,.66);border:1px solid rgba(184,194,255,.15);backdrop-filter:blur(24px) saturate(155%);box-shadow:0 14px 48px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.06)}
    .sidebar{background:rgba(9,15,34,.82);border-left:1px solid rgba(184,194,255,.13);backdrop-filter:blur(24px)}
    .brand-mark{background:linear-gradient(135deg,#5965e8,#9a64ec);font-size:0}
    .brand-mark svg{width:23px;height:23px;color:white}
    .nav-icon{width:23px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 23px}
    .nav-icon svg{width:19px;height:19px;display:block}
    .mobile-menu svg{width:20px;height:20px}
    .avatar svg{width:19px;height:19px}
    .auth-card{border:1px solid rgba(255,255,255,.16);box-shadow:0 28px 90px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.14)}
    .btn{box-shadow:0 5px 18px rgba(108,96,245,.2)}
    .splash{position:fixed}
    #splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,#080d22,#1b1040 52%,#0b1834);transition:opacity .55s ease,visibility .55s ease}
    #splash.hide{opacity:0;visibility:hidden;pointer-events:none}
    .splash-orb{position:absolute;border-radius:50%;filter:blur(75px);animation:floatOrb 7s ease-in-out infinite}
    .splash-orb.o1{width:390px;height:390px;top:-100px;left:-90px;background:rgba(91,104,245,.3)}
    .splash-orb.o2{width:350px;height:350px;right:-70px;bottom:-110px;background:rgba(151,91,237,.25);animation-delay:-3s}
    @keyframes floatOrb{50%{transform:translateY(-24px) scale(1.05)}}
    .splash-content{position:relative;display:flex;flex-direction:column;align-items:center;gap:13px;color:white}
    .splash-logo{width:76px;height:76px;display:grid;place-items:center;border:1px solid #ffffff35;border-radius:23px;background:#ffffff12;backdrop-filter:blur(20px);box-shadow:0 15px 55px #655cf255}
    .splash-logo svg{width:34px;height:34px}
    .splash-title{font-size:24px;font-weight:800}
    .splash-subtitle{font-size:12px;color:#ffffff8a}
    .splash-progress{width:160px;height:3px;border-radius:9px;background:#ffffff20;overflow:hidden;margin-top:12px}
    .splash-progress span{display:block;height:100%;width:100%;background:linear-gradient(90deg,#6874ff,#ba8aff);transform:translateX(100%);animation:loadLine 1.2s ease forwards}
    @keyframes loadLine{to{transform:translateX(0)}}
    .jalali-wrap{position:relative;width:100%}
    .jalali-display{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#ffffff0b;color:var(--text);outline:none;cursor:pointer;text-align:right}
    .jalali-display:focus{border-color:var(--purple);box-shadow:0 0 0 3px #8b7cff22}
    .jalali-pop{position:absolute;z-index:1000;top:calc(100% + 7px);right:0;width:min(310px,90vw);padding:13px;border:1px solid #a8b2ff35;border-radius:16px;background:#111a32;box-shadow:0 18px 55px #0008;direction:rtl}
    .jalali-pop.hidden{display:none!important}
    .jp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
    .jp-head strong{font-size:13px;color:#f5f5ff}
    .jp-nav{width:30px;height:30px;border-radius:9px;background:#ffffff10;color:#fff;font-size:18px}
    .jp-week,.jp-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
    .jp-week span{font-size:10px;color:#9ca9ca;padding:5px 0}
    .jp-day{height:32px;border-radius:8px;color:#e8eaff;font-size:12px;background:transparent}
    .jp-day:hover{background:#8a85ff35}
    .jp-day.selected{background:linear-gradient(135deg,#656cf0,#9867e8);color:white;font-weight:800}
    .jp-day.today{outline:1px solid #a5a5ff}
    .jp-day.empty{pointer-events:none}
    .jp-time{margin-top:9px;display:flex;align-items:center;gap:8px}
    .jp-time input{flex:1;min-width:0;padding:8px;border-radius:9px;border:1px solid #ffffff20;background:#ffffff0b;color:#fff}
    .nav-icon svg,.stat-icon svg,.quick b svg{width:20px;height:20px;vertical-align:middle}
    .stat-icon{font-size:0!important;display:grid;place-items:center}
    .stat-icon svg{width:19px;height:19px}
    .quick b{font-size:0!important;display:block}
    .quick b svg{width:22px;height:22px;margin-bottom:5px}
    @media(max-width:760px){.jalali-pop{position:fixed;top:50%;left:50%;right:auto;transform:translate(-50%,-50%);width:min(330px,92vw)}}

  
    .tier-list{display:grid;gap:10px;margin-top:10px}
    .tier-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:9px;align-items:end;padding:12px;border:1px solid var(--line);border-radius:14px;background:#ffffff08}
    .tier-row label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
    .tier-row input{width:100%;min-width:0;padding:10px;border:1px solid var(--line);border-radius:10px;background:#ffffff0b;color:var(--text)}
    .tier-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .btn-danger{background:#ef444422;border:1px solid #ef444455;color:#fecaca;border-radius:10px;padding:8px 10px;cursor:pointer}
    @media(max-width:650px){.tier-row{grid-template-columns:1fr 1fr}.tier-row .tier-remove{grid-column:1/-1}}

  .row-actions{white-space:nowrap}.btn-danger{border:1px solid rgba(255,100,130,.35);background:rgba(255,90,120,.12);color:#ff9caf;border-radius:9px;padding:7px 10px}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin-top:15px}.cal-weekday{text-align:center;color:var(--muted);padding:7px}.cal-day{min-height:66px;border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:5px}.cal-day small{font-size:10px;color:var(--muted)}.cal-day.complete{background:rgba(101,214,160,.13);border-color:rgba(101,214,160,.3)}.cal-day.partial{background:rgba(255,190,90,.13);border-color:rgba(255,190,90,.3)}.cal-day.missing{background:rgba(255,125,145,.07)}@media(max-width:560px){.cal-day{min-height:54px;padding:5px}.cal-day small{font-size:9px}}
  </style>
</head>
<body>

  <section id="splash" aria-label="در حال آماده‌سازی">
    <div class="splash-orb o1"></div><div class="splash-orb o2"></div>
    <div class="splash-content">
      <div class="splash-logo"><svg class="" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 8h18M16 14h2"/></svg></div>
      <div class="splash-title">مدیریت مالی من</div>
      <div class="splash-subtitle">فضای امن حقوق، کارکرد و امور مالی</div>
      <div class="splash-progress"><span></span></div>
    </div>
  </section>


  <section id="authScreen" class="auth-wrap">
    <div class="auth-card glass">
      <div class="brand">
        <div class="brand-mark"><svg class="" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 8h18M16 14h2"/></svg></div>
        <h1>مدیریت مالی من</h1>
        <p>مدیریت هوشمند حقوق و امور مالی شخصی</p>
      </div>
      <div class="field">
        <label for="email">ایمیل</label>
        <input id="email" type="email" autocomplete="email" placeholder="name@example.com">
      </div>
      <div class="field">
        <label for="password">رمز عبور</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="حداقل ۶ کاراکتر">
      </div>
      <button id="loginBtn" class="btn full">ورود به حساب</button>
      <div class="auth-actions">
        <button id="signupBtn" class="btn btn-outline">ساخت حساب</button>
        <button id="resetBtn" class="btn btn-outline">فراموشی رمز</button>
      </div>
      <div id="authMessage" class="message" role="status"></div>
      <div class="footer">فضای خصوصی مدیریت حقوق و امور مالی</div>
    </div>
  </section>

  <section id="appScreen" class="app hidden">
    <aside id="sidebar" class="sidebar">
      <div class="side-brand">
        <div class="brand-mark"><svg class="" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 8h18M16 14h2"/></svg></div>
        <div><strong>مدیریت مالی من</strong><small>سامانه شخصی حقوق و امور مالی</small></div>
      </div>

      <div class="nav-label">نمای کلی</div>
      <button class="nav-btn active" data-page="dashboard"><span class="nav-icon"><svg class="" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h14V9"/><path d="M9 20v-6h6v6"/></svg></span>داشبورد تحلیل</button>

      <div class="nav-label">مدیریت کار و حقوق</div>

    // Refresh an expired/near-expiry Supabase access token before database writes.
    async function runWithFreshSession(operation){
      const sessionResult=await supabase.auth.getSession();
      if(sessionResult.error) throw sessionResult.error;
      let session=sessionResult.data?.session;
      if(!session?.refresh_token){
        throw new Error("نشست ورود معتبر نیست؛ لطفاً یک‌بار خارج شو و دوباره وارد حساب شو.");
      }
      const expiresAt=Number(session.expires_at||0)*1000;
      if(!expiresAt || expiresAt < Date.now()+120000){
        const refreshed=await supabase.auth.refreshSession({refresh_token:session.refresh_token});
        if(refreshed.error || !refreshed.data?.session){
          await supabase.auth.signOut();
          throw new Error("اعتبار ورود تمام شده و تمدید آن ممکن نشد؛ لطفاً دوباره وارد حساب کاربری شو.");
        }
      }
      let result=await operation();

        const latest=await supabase.auth.getSession();

          throw new Error("نشست ورود منقضی شده است؛ دوباره وارد حساب شو و ثبت را تکرار کن.");
        }
        result=await operation();
      }
      return result;

    const titles={dashboard:"داشبورد تحلیل",work:"ثبت ساعت کاری",leave:"مرخصی‌ها",sales:"فروش و پورسانت",payroll:"حقوق و دریافتی",claims:"مطالبات فروشگاه",finance:"امور مالی شخصی",accounts:"حساب‌ها و تراکنش‌ها",installments:"اقساط و بدهی‌ها",receivables:"طلب از دیگران",reports:"گزارش‌ها و تحلیل",goals:"اهداف و پیش‌بینی",calendar:"تقویم و یادآورها",reconciliation:"مرکز مغایرت‌یابی",history:"تاریخچه تغییرات",trace:"ردیابی منشأ اعداد",archive:"بایگانی و پشتیبان‌گیری",settings:"تنظیمات مدیریتی"};
    const TZ="Asia/Tehran";
    const today=()=>new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
    const faNum=v=>String(v).replace(/[0-9]/g,d=>"۰۱۲۳۴۵۶۷۸۹"[Number(d)]);
    const enNum=v=>String(v).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));

    function jalaliToIso(value){const s=enNum(value).replace(/[.\-]/g,"/").trim();const m=s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);if(!m)throw new Error("تاریخ را به شکل سال/ماه/روز شمسی وارد کن.");const jy=+m[1],jm=+m[2],jd=+m[3];if(!isValidJalaaliDate(jy,jm,jd))throw new Error("تاریخ شمسی معتبر نیست.");const g=toGregorian(jy,jm,jd);return `${g.gy}-${pad2(g.gm)}-${pad2(g.gd)}`}
    function tehranNowParts(){const parts=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());const o=Object.fromEntries(parts.map(p=>[p.type,p.value]));return {date:`${o.year}-${o.month}-${o.day}`,time:`${o.hour}:${o.minute}`}}

    const configs={
      work:{table:"work_sessions",title:"ثبت بازه کاری",desc:"هر بازه ورود و خروج را جداگانه ثبت کن. برای هر روز می‌توانی چند بازه داشته باشی.",fields:[field("work_date","تاریخ","date",{required:true,default:today()}),field("start_time","ساعت ورود","time",{required:true}),field("end_time","ساعت خروج","time"),field("description","توضیحات","text")],columns:[["work_date","تاریخ",fmtDate],["started_at","ورود",fmtDateTime],["ended_at","خروج",fmtDateTime],["break_minutes","وقفه (دقیقه)",nfmt],["description","توضیحات"]],order:"work_date"},

    function formHtml(cfg){
      return `<form id="recordForm" class="panel glass"><div class="section-head"><h3>${cfg.title}</h3><span>ثبت اطلاعات</span></div><div class="form-grid">${cfg.fields.map(f=>{

        if(f.type==="checkbox")return `<div class="control"><label>${f.label}</label><select name="${f.name}"><option value="false">خیر</option><option value="true" ${val?"selected":""}>بله</option></select></div>`;
        if(f.type==="date"||f.type==="datetime-local")return `<div class="control"><label>${f.label}</label>${jalaliField(f.name,val,f.type==="datetime-local")}</div>`;
        return `<div class="control"><label>${f.label}</label><input name="${f.name}" type="${f.type||"text"}" value="${esc(val)}" ${required} ${f.placeholder?`placeholder="${esc(f.placeholder)}"`:""} ${f.type==="number"?'min="0" step="any"':""}></div>`;
      }).join("")}</div><div class="form-actions"><button class="btn" type="submit">ثبت اطلاعات</button><span class="inline-note">تاریخ‌ها با تقویم شمسی و منطقه زمانی ایران ثبت می‌شوند.</span></div><div id="formFeedback"></div></form>`;

    function tableHtml(rows,cols,page=null){if(!rows.length)return `<div class="empty">هنوز رکوردی برای نمایش وجود ندارد.</div>`;return `<div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join("")}${page?"<th>عملیات</th>":""}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(c[2]?c[2](r[c[0]],r):r[c[0]]??"—")}</td>`).join("")}${page?`<td class="row-actions"><button type="button" class="btn btn-outline btn-sm" data-edit-row="${esc(r.id)}" data-edit-page="${page}">ویرایش</button> <button type="button" class="btn-danger btn-sm" data-delete-row="${esc(r.id)}" data-delete-page="${page}">حذف</button></td>`:""}</tr>`).join("")}</tbody></table></div>`}
    async function recalculatePayrollForDate(isoDate){
      if(!isoDate)throw new Error("تاریخ رکورد مشخص نیست.");
      const [gy,gm,gd]=String(isoDate).slice(0,10).split("-").map(Number);
      const j=toJalaali(gy,gm,gd);
      const start=toGregorian(j.jy,j.jm,1);
      const end=toGregorian(j.jy,j.jm,jalaaliMonthLength(j.jy,j.jm));
      const periodStart=`${start.gy}-${pad2(start.gm)}-${pad2(start.gd)}`;
      const periodEnd=`${end.gy}-${pad2(end.gm)}-${pad2(end.gd)}`;
      const {data,error}=await supabase.rpc("calculate_payroll_period",{p_year:j.jy,p_month:j.jm,p_period_start:periodStart,p_period_end:periodEnd});
      if(error)throw error;
      return {id:data,year:j.jy,month:j.jm};
    }
    function tierEditorRows(mode){
      const defaults=mode==="flat_rate"?[{lower_amount:0,upper_amount:null,rate_percent:2,tier_order:1}]:[{lower_amount:0,upper_amount:299000000,rate_percent:2,tier_order:1},{lower_amount:299000000,upper_amount:null,rate_percent:3,tier_order:2}];
      return defaults.map(t=>tierRowHtml(t)).join("");
    }
    function tierRowHtml(t={}){return `<div class="tier-row"><div><label>از مبلغ فروش (تومان)</label><input data-tier-lower type="number" min="0" step="any" value="${Number(t.lower_amount??0)}"></div><div><label>تا مبلغ (خالی = بدون سقف)</label><input data-tier-upper type="number" min="0" step="any" value="${t.upper_amount??""}" placeholder="بدون سقف"></div><div><label>درصد پورسانت</label><input data-tier-rate type="number" min="0" max="100" step="0.01" value="${Number(t.rate_percent??2)}"></div><button type="button" class="btn-danger tier-remove">حذف</button></div>`}
    function readTierEditor(){
      const rows=[...document.querySelectorAll("#tiersEditor .tier-row")];
      return rows.map((row,i)=>{const lower=Number(row.querySelector("[data-tier-lower]").value||0),upperRaw=row.querySelector("[data-tier-upper]").value,rate=Number(row.querySelector("[data-tier-rate]").value);if(!Number.isFinite(lower)||lower<0||!Number.isFinite(rate)||rate<0||rate>100)throw new Error("مقادیر پله‌های پورسانت معتبر نیستند.");const upper=upperRaw===""?null:Number(upperRaw);if(upper!==null&&(!Number.isFinite(upper)||upper<=lower))throw new Error("سقف هر پله باید از مبلغ شروع آن بیشتر باشد.");return {lower_amount:lower,upper_amount:upper,rate_percent:rate,tier_order:i+1}});
    }

    async function openCrud(page){
      const cfg=configs[page];
      shell(`<section class="page-panel glass"><h3>${cfg.title}</h3><p>${cfg.desc}</p></section><div id="pageNotice"></div>${formHtml(cfg)}<section class="panel glass"><div class="toolbar"><h3>سوابق ثبت‌شده</h3><button id="refreshBtn" class="btn btn-outline btn-sm">بروزرسانی</button></div><div id="records" class="loading">در حال دریافت اطلاعات…</div></section>`);
      $("refreshBtn").onclick=()=>loadCrudRows(page);
      let editingId=null;
      const resetEditor=()=>{editingId=null;const f=$("recordForm");f.reset();f.querySelectorAll(".jalali-wrap").forEach(w=>{const h=w.querySelector('input[type="hidden"]');if(h?.dataset.date){h.value=h.dataset.date;w.querySelector(".jalali-display").value=isoToJalali(h.dataset.date)}});f.querySelector('button[type="submit"]').textContent="ثبت اطلاعات";$("formFeedback").innerHTML=""};
      $("records").addEventListener("click",async ev=>{
        const del=ev.target.closest("[data-delete-row]");
        if(del){const id=del.dataset.deleteRow;if(!confirm("این رکورد برای همیشه حذف شود؟"))return;del.disabled=true;try{const {error}=await runWithFreshSession(()=>supabase.from(cfg.table).delete().eq("id",id).eq("user_id",currentUser.id));if(error)throw error;const deletedRow=(cache[page]||[]).find(x=>x.id===id);if((page==="work"||page==="sales")&&deletedRow){const dt=page==="work"?deletedRow.work_date:deletedRow.sale_date;try{await recalculatePayrollForDate(dt)}catch(calcErr){notify("رکورد حذف شد، اما محاسبه مجدد حقوق انجام نشد: "+calcErr.message,"bad")}}await loadCrudRows(page);notify("رکورد حذف شد.","ok")}catch(err){notify("حذف انجام نشد: "+err.message,"bad")}finally{del.disabled=false}return}
        const edit=ev.target.closest("[data-edit-row]");if(!edit)return;
        const row=(cache[page]||[]).find(x=>x.id===edit.dataset.editRow);if(!row)return;editingId=row.id;
        for(const f of cfg.fields){let v=row[f.name];
          if(page==="work"&&f.name==="start_time")v=row.started_at?new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(new Date(row.started_at)):"";
          if(page==="work"&&f.name==="end_time")v=row.ended_at?new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(new Date(row.ended_at)):"";
          if(f.type==="date"||f.type==="datetime-local"){const w=$("recordForm").querySelector(`[name="${f.name}"]`)?.closest(".jalali-wrap");if(w&&v){const date=String(v).slice(0,10),h=w.querySelector('input[type="hidden"]');h.value=f.type==="datetime-local"?v:date;h.dataset.date=date;w.querySelector(".jalali-display").value=isoToJalali(date);if(f.type==="datetime-local"){const t=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(new Date(v));w.querySelector('input[type="time"]').value=t}}continue}
          const input=$("recordForm").elements.namedItem(f.name);if(input){if(f.type==="checkbox")input.value=String(!!v);else input.value=v??""}
        }
        $("recordForm").querySelector('button[type="submit"]').textContent="ذخیره تغییرات";$("formFeedback").innerHTML=msg("در حال ویرایش رکورد انتخاب‌شده هستی. پس از اصلاح، ذخیره تغییرات را بزن.","info");window.scrollTo({top:0,behavior:"smooth"});
      });
      $("recordForm").onsubmit=async e=>{
        e.preventDefault();const form=e.currentTarget,fd=new FormData(form),row={user_id:currentUser.id};
        cfg.fields.forEach(f=>{let v=fd.get(f.name);if(v===null)return;if(f.type==="number")row[f.name]=v===""?0:Number(v);else if(f.type==="checkbox")row[f.name]=v==="true";else if(f.type==="datetime-local")row[f.name]=v;else if(f.name==="start_time"||f.name==="end_time"){}else row[f.name]=v===""?null:v});
        let payrollDate=null;
        if(page==="work"){const d=fd.get("work_date"),st=fd.get("start_time"),en=fd.get("end_time");if(!st){$("formFeedback").innerHTML=msg("ساعت ورود الزامی است.","bad");return}row.started_at=localIso(d,st);row.ended_at=en?localIso(d,en):null;delete row.start_time;delete row.end_time;delete row.work_date;row.work_date=d;payrollDate=d}

        try{
          let dbResult;
          if(editingId){
            if(page==="work"){const d=fd.get("work_date"),st=fd.get("start_time"),en=fd.get("end_time");if(!st)throw new Error("ساعت ورود الزامی است.");row.started_at=localIso(d,st);row.ended_at=en?localIso(d,en):null;delete row.start_time;delete row.end_time;delete row.work_date;row.work_date=d}
            const previousRow=(cache[page]||[]).find(x=>x.id===editingId);dbResult=await runWithFreshSession(()=>supabase.from(cfg.table).update(row).eq("id",editingId).eq("user_id",currentUser.id));

          }
          $("formFeedback").innerHTML=msg(feedback,"ok");
          await loadCrudRows(page);
          
        }catch(error){$("formFeedback").innerHTML=msg("ثبت اطلاعات انجام نشد: "+error.message,"bad")}
        finally{if(submit){submit.disabled=false;submit.textContent="ثبت اطلاعات"}}
      };
      await loadCrudRows(page);

    async function loadDashboard(){if(!currentUser)return;const nowJ=toJalaali(...today().split("-").map(Number));const monthStartG=toGregorian(nowJ.jy,nowJ.jm,1);const monthStart=`${monthStartG.gy}-${pad2(monthStartG.gm)}-${pad2(monthStartG.gd)}`;const nextJ=nowJ.jm===12?{jy:nowJ.jy+1,jm:1}:{jy:nowJ.jy,jm:nowJ.jm+1};const monthEndG=toGregorian(nextJ.jy,nextJ.jm,1);const monthEnd=`${monthEndG.gy}-${pad2(monthEndG.gm)}-${pad2(monthEndG.gd)}`;const [f,p,w,sales,period]=await Promise.allSettled([supabase.from("v_finance_dashboard").select("*").eq("user_id",currentUser.id).maybeSingle(),supabase.from("v_payroll_dashboard_summary").select("*").eq("user_id",currentUser.id).maybeSingle(),supabase.from("v_daily_work_summary").select("actual_work_minutes").eq("user_id",currentUser.id).gte("day",monthStart).lt("day",monthEnd),supabase.from("sales_records").select("sales_channel,amount").eq("user_id",currentUser.id).gte("sale_date",monthStart).lt("sale_date",monthEnd),supabase.from("payroll_periods").select("fixed_salary,hourly_rate,sales_total,commission_total,benefits_total,deductions_total,calculated_total,total_work_minutes").eq("user_id",currentUser.id).eq("year",nowJ.jy).eq("month",nowJ.jm).maybeSingle()]);if(f.status==="fulfilled"&&!f.value.error&&f.value.data){$("moneyValue").textContent=money(f.value.data.available_money);$("assetsValue").textContent=money(f.value.data.net_worth)}else $("moneyValue").textContent="—";const sum=p.status==="fulfilled"&&!p.value.error?p.value.data:null;$("salaryValue").textContent=money(sum?.total_payroll??0);if(w.status==="fulfilled"&&!w.value.error){const mins=(w.value.data||[]).reduce((a,r)=>a+num(r.actual_work_minutes),0);$("hoursValue").textContent=nfmt(Math.floor(mins/60))+" ساعت و "+nfmt(mins%60)+" دقیقه"}else $("hoursValue").textContent="—";let site=0,store=0;if(sales.status==="fulfilled"&&!sales.value.error){for(const r of sales.value.data||[]){if(r.sales_channel==="website")site+=num(r.amount);if(r.sales_channel==="in_person")store+=num(r.amount)}}$("siteSalesValue").textContent=money(site);$("storeSalesValue").textContent=money(store);const pr=period.status==="fulfilled"&&!period.value.error?period.value.data:null;const gross=pr?num(pr.fixed_salary)+num(pr.hourly_rate)*num(pr.total_work_minutes||0)/60+num(pr.commission_total)+num(pr.benefits_total):0;const net=pr?num(pr.calculated_total):0;$("grossSalaryValue").textContent=pr?money(gross):"هنوز محاسبه نشده";$("netSalaryValue").textContent=pr?money(net):"هنوز محاسبه نشده";const failed=[f,p,w,sales,period].filter(x=>x.status==="rejected"||x.status==="fulfilled"&&x.value.error).length;$("dashboardStatus").innerHTML=failed?msg("برخی اطلاعات در دسترس نیستند؛ جزئیات خطا در کنسول مرورگر قابل بررسی است.","bad"):"اطلاعات داشبورد از پایگاه داده دریافت شد."}
    async function payrollPage(){shell(`<section class="page-panel glass"><h3>حقوق و دریافتی</h3><p>محاسبه حقوق با تابع دیتابیس انجام می‌شود تا قوانین ثبت‌شده و snapshot دوره حفظ شود.</p><div class="alert info">قبل از محاسبه، فروش‌ها و بازه‌های کاری همان دوره را ثبت کن. سال، ماه و تاریخ شروع و پایان را با تقویم شمسی انتخاب کن؛ تبدیل به تاریخ استاندارد پایگاه داده به‌صورت خودکار انجام می‌شود.</div></section><div id="pageNotice"></div><form id="payrollCalc" class="panel glass"><div class="form-grid"><div class="control"><label>سال شمسی</label><input name="year" type="number" min="1300" max="1500" required value="${toJalaali(...today().split("-").map(Number)).jy}"></div><div class="control"><label>ماه شمسی (۱ تا ۱۲)</label><input name="month" type="number" min="1" max="12" required value="${toJalaali(...today().split("-").map(Number)).jm}"></div><div class="control"><label>شروع دوره</label>${jalaliField("period_start",today(),false)}</div><div class="control"><label>پایان دوره</label>${jalaliField("period_end",today(),false)}</div></div><div class="form-actions"><button class="btn">محاسبه دوره حقوق</button></div><div id="payrollFeedback"></div></form><section class="panel glass"><div class="toolbar"><h3>دوره‌های حقوقی</h3><button id="refreshPayroll" class="btn btn-outline btn-sm">بروزرسانی</button></div><div id="payrollRows" class="loading">در حال دریافت…</div></section>`);$("payrollCalc").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));const {data,error}=await supabase.rpc("calculate_payroll_period",{p_year:Number(d.year),p_month:Number(d.month),p_period_start:d.period_start,p_period_end:d.period_end});$("payrollFeedback").innerHTML=error?msg(error.message,"bad"):msg("دوره حقوق محاسبه شد. شناسه: "+data,"ok");if(!error)loadPayrollRows()};$("refreshPayroll").onclick=loadPayrollRows;await loadPayrollRows()}

    async function archivePage(){shell(`<section class="page-panel glass"><h3>بایگانی و پشتیبان‌گیری</h3><p>ساخت snapshot از طریق تابع create_personal_data_archive انجام می‌شود.</p></section><div id="pageNotice"></div><form id="archiveForm" class="panel glass"><div class="control"><label>نام آرشیو</label><input name="archive_name" required value="پشتیبان ${today()}"></div><div class="form-actions"><button class="btn">ساخت نسخه پشتیبان</button></div><div id="archiveFeedback"></div></form><section class="panel glass"><h3>آرشیوهای قبلی</h3><div id="archiveRows" class="loading"></div></section>`);$("archiveForm").onsubmit=async e=>{e.preventDefault();const name=new FormData(e.currentTarget).get("archive_name");const {data,error}=await supabase.rpc("create_personal_data_archive",{p_archive_name:name});$("archiveFeedback").innerHTML=error?msg(error.message,"bad"):msg("نسخه پشتیبان ایجاد شد. شناسه: "+data,"ok");if(!error)loadArchives()};await loadArchives()}

    async function attendanceCalendar(){const j=toJalaali(...today().split("-").map(Number));let yy=j.jy,mm=j.jm;async function draw(){shell(`<section class="page-panel glass"><h3>تقویم کارکرد</h3><p>روزهای ثبت‌شده، ناقص و بدون ثبت را در ماه انتخابی ببین.</p><div class="toolbar"><button id="calPrev" class="btn btn-outline btn-sm">ماه قبل</button><strong id="calLabel">${faNum(yy)}/${faNum(mm)}</strong><button id="calNext" class="btn btn-outline btn-sm">ماه بعد</button></div><div id="attendanceGrid" class="calendar-grid"></div><div class="inline-note">● ثبت کامل 　● ورود بدون خروج 　● بدون ثبت</div></section>`);const start=toGregorian(yy,mm,1),len=jalaaliMonthLength(yy,mm),end=toGregorian(mm===12?yy+1:yy,mm===12?1:mm+1,1),from=`${start.gy}-${pad2(start.gm)}-${pad2(start.gd)}`,to=`${end.gy}-${pad2(end.gm)}-${pad2(end.gd)}`;const {data,error}=await supabase.from("work_sessions").select("work_date,started_at,ended_at").eq("user_id",currentUser.id).gte("work_date",from).lt("work_date",to);if(error){$("attendanceGrid").innerHTML=msg(error.message,"bad");return}const map={};for(const r of data||[]){map[r.work_date]??={in:false,out:false};map[r.work_date].in ||= !!r.started_at;map[r.work_date].out ||= !!r.ended_at}const first=(new Date(Date.UTC(start.gy,start.gm-1,start.gd)).getUTCDay()+1)%7;let html=["ش","ی","د","س","چ","پ","ج"].map(x=>`<div class="cal-weekday">${x}</div>`).join("");for(let z=0;z<first;z++)html+="<div></div>";for(let d=1;d<=len;d++){const g=toGregorian(yy,mm,d),iso=`${g.gy}-${pad2(g.gm)}-${pad2(g.gd)}`,v=map[iso],cls=!v?"missing":v.in&&v.out?"complete":"partial";html+=`<div class="cal-day ${cls}" title="${!v?"بدون ثبت":v.in&&v.out?"ورود و خروج ثبت شده":"ثبت ناقص"}"><b>${faNum(d)}</b><small>${!v?"بدون ثبت":v.in&&v.out?"کامل":"ناقص"}</small></div>`}$("attendanceGrid").innerHTML=html;$("calPrev").onclick=()=>{mm--;if(mm<1){mm=12;yy--}draw()};$("calNext").onclick=()=>{mm++;if(mm>12){mm=1;yy++}draw()}}await draw()}
    async function openPage(page){if(!titles[page])return;activePage=page;navActive(page);$("pageTitle").textContent=titles[page];$("sidebar").classList.remove("open");try{if(page==="dashboard")return await dashboard();if(configs[page])return await openCrud(page);if(page==="transactions")return await openCrud("transactions");if(page==="payroll")return await payrollPage();if(page==="reports")return await reportsPage();if(page==="reconciliation")return await reconciliation();if(page==="history")return await simpleViewPage(titles[page],"v_audit_history",[["created_at","زمان",fmtDateTime],["action","عملیات"],["entity_type","نوع رکورد"],["entity_id","شناسه"],["details","جزئیات",v=>JSON.stringify(v)]],"رویدادهای قابل مشاهده در audit_logs.");if(page==="trace")return await simpleViewPage(titles[page],"v_financial_source_trace",[["transaction_date","تاریخ",fmtDateTime],["title","عنوان"],["amount","مبلغ",money],["source_type","منشأ"],["account_name","حساب"],["payroll_year","سال حقوق"],["payroll_month","ماه حقوق"]],"منشأ تراکنش‌ها و ارتباط آن‌ها با پرداخت‌های دیگر.");if(page==="archive")return await archivePage();if(page==="settings")return await settingsPage();if(page==="finance")return await simpleViewPage("نمای کلی امور مالی","v_finance_dashboard",[["available_money","پول در دسترس",money],["receivables","مطالبات",money],["debts","بدهی‌ها",money],["total_financial_assets","کل دارایی",money],["net_worth","دارایی خالص",money]]);if(page==="installments")return await simpleViewPage(titles[page],"v_finance_installment_balances",[["title","عنوان"],["creditor_name","طلبکار"],["total_amount","کل",money],["paid_amount","پرداخت‌شده",money],["remaining_amount","مانده",money],["next_due_date","سررسید",fmtDate],["status","وضعیت"]]);if(page==="receivables")return await openCrud("receivables");if(page==="accounts")return await openCrud("accounts");if(page==="goals")return await openCrud("goals");if(page==="calendar")return await attendanceCalendar();if(page==="leave")return await openCrud("leave");if(page==="work")return await openCrud("work");if(page==="sales")return await openCrud("sales");if(page==="claims")return await openCrud("claims");shell(`<section class="page-panel glass"><h3>${titles[page]}</h3><p>این بخش در این نسخه فقط خواندنی یا در انتظار تکمیل عملیات تخصصی است.</p></section>`)}catch(e){shell(`<section class="page-panel glass"><h3>${titles[page]}</h3>${msg(e.message,"bad")}</section>`)}}
    async function init(){
      // Do not query Supabase from inside onAuthStateChange: the auth lock may still be held.
      const {data,error}=await supabase.auth.getSession();
      if(error) throw error;
      let session=data?.session||null;
      if(session?.refresh_token){
        const refreshed=await supabase.auth.refreshSession({refresh_token:session.refresh_token});
        if(refreshed.error || !refreshed.data?.session){
          await supabase.auth.signOut();
          showAuth();
          setAuthMessage("نشست قبلی معتبر نبود؛ لطفاً دوباره وارد حساب شو.","error");
          return;
        }
        session=refreshed.data.session;
      }
      supabase.auth.onAuthStateChange((_event,nextSession)=>{
        // Defer UI/database work until Supabase finishes its internal auth notification.
        queueMicrotask(()=>{
          if(nextSession?.user){
            if(currentUser?.id!==nextSession.user.id || appScreen.classList.contains("hidden")) showApp(nextSession.user).catch(e=>console.error("نمایش داشبورد:",e));
          } else if(!nextSession) showAuth();
        });
      });
      if(session?.user) await showApp(session.user); else showAuth();
    }
    init().catch(error=>{console.error("MY SALARY initialization:",error);setAuthMessage("راه‌اندازی سایت با خطا روبه‌رو شد: "+error.message,"error")});
  </script>
